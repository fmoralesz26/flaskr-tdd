<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h1>Iniciar Sesión</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Usuario"
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
        >

        <button type="submit">
            Ingresar
        </button>

    </form>

</body>
</html>
