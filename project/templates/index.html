<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flask Taskr</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Tareas</h1>

        <form action="{{ url_for('add_entry') }}" method="post" class="add-entry">
            <input type="text" name="title" placeholder="Título" required>
            <textarea name="text" placeholder="Contenido"></textarea>
            
            <div class="priority-selector">
                <label for="priority">Prioridad:</label>
                <select name="priority" id="priority">
                    <option value="Alta">Alta</option>
                    <option value="Media" selected>Media</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>

            <button type="submit">Agregar Tarea</button>
        </form>

        <ul class="entries">
            {% for entry in entries %}
            <li>
                <h2>{{ entry.title }}</h2>
                
                <span class="badge priority-{{ entry.priority|lower }}">
                    {{ entry.priority }}
                </span>

                <p>{{ entry.text|safe }}</p>
                
                <a href="{{ url_for('delete_entry', post_id=entry.id) }}" class="delete">Eliminar</a>
            </li>
            {% else %}
            <li><em>No hay tareas registradas.</em></li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
